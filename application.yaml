apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-dev
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # source:
  #   repoURL: https://github.com/paoloyx/helmfile-test-kargo
  #   targetRevision: HEAD
  #   path: .
  #   plugin:
  #     name: helmfile-plugin
  #     env:
  #       - name: ARGOCD_ENV_CLUSTER_NAME
  #         value: dev
  sourceHydrator:
    drySource:
      repoURL: https://github.com/paoloyx/helmfile-test-kargo
      path: .
      targetRevision: HEAD
    syncSource:
      targetBranch: environments/dev
      path: .
    hydrateTo:
      targetBranch: environments/dev-next
